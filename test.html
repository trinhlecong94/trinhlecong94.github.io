<head>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            margin-top: 15px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 20px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
        }

        .question-block {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .question-block.answered {
            background: #f0f8ff;
        }

        .question-block.correct {
            border-left-color: #4CAF50;
            background: #f1f8f4;
        }

        .question-block.incorrect {
            border-left-color: #f44336;
            background: #fef5f5;
        }

        .question-number {
            font-weight: bold;
            color: #667eea;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .option:hover:not(.disabled) {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option.selected {
            background: #e3f2fd;
            border-color: #667eea;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option.correct {
            background: #c8e6c9;
            border-color: #4CAF50;
            color: #2e7d32;
            font-weight: 600;
        }

        .option.incorrect {
            background: #ffcdd2;
            border-color: #f44336;
            color: #c62828;
        }

        .feedback {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback.incorrect-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #ddd;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-reset {
            background: #667eea;
            color: white;
        }

        .btn-reset:hover {
            background: #5568d3;
        }

        .btn-show-answers {
            background: #ff9800;
            color: white;
        }

        .btn-show-answers:hover {
            background: #e68900;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 12px;
            }

            .question-block {
                padding: 15px;
                margin-bottom: 20px;
            }

            .question-text {
                font-size: 14px;
            }

            .option {
                font-size: 14px;
                padding: 10px 12px;
            }

            .stats {
                gap: 10px;
            }

            .stat-number {
                font-size: 20px;
            }

            .stat-label {
                font-size: 11px;
            }
        }

            background: #667eea;
            color: white;
            padding: 12px 20px;
            margin: 20px -20px 15px -20px;
            font-weight: bold;
            font-size: 14px;
        }

</head>

            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = '';

            let currentSection = '';
            questions.forEach((q, index) => {
                if (q.section !== currentSection) {
                    currentSection = q.section;
                    const sectionDiv = document.createElement('div');
                    sectionDiv.className = 'section-title';
                    sectionDiv.textContent = currentSection;
                    contentDiv.appendChild(sectionDiv);
                }

                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-block';
                questionDiv.id = `question-${q.id}`;

                let optionsHTML = q.options.map((opt, optIndex) => {
                    const optionLetters = ['A', 'B', 'C', 'D'];
                    return `
                        <label class="option" id="option-${q.id}-${optIndex}">

                                onchange="handleAnswer(${q.id}, ${optIndex})">
                            <span><strong>${optionLetters[optIndex]}.</strong> ${opt}</span>
                        </label>
                    `;
                }).join('');

                questionDiv.innerHTML = `
                    <div class="question-number">Câu ${q.id}</div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">
                        ${optionsHTML}
                    </div>
                    <div class="feedback" id="feedback-${q.id}"></div>
                `;

                contentDiv.appendChild(questionDiv);
            });
        }

        function handleAnswer(questionId, selectedIndex) {
            const question = questions.find(q => q.id === questionId);
            answered[questionId] = selectedIndex;

            const questionBlock = document.getElementById(`question-${questionId}`);
            const feedback = document.getElementById(`feedback-${questionId}`);

            // Reset all options
            for (let i = 0; i < 4; i++) {
                const option = document.getElementById(`option-${questionId}-${i}`);
                option.classList.remove('correct', 'incorrect', 'selected');
            }

            // Highlight selected option
            const selectedOption = document.getElementById(`option-${questionId}-${selectedIndex}`);
            selectedOption.classList.add('selected');

            // Show correct/incorrect feedback
            if (selectedIndex === question.correct) {
                selectedOption.classList.remove('selected');
                selectedOption.classList.add('correct');
                questionBlock.classList.remove('incorrect');
                questionBlock.classList.add('correct', 'answered');
                feedback.className = 'feedback show correct-message';
                feedback.innerHTML = '✅ Chính xác!';
            } else {
                selectedOption.classList.remove('selected');
                selectedOption.classList.add('incorrect');
                const correctOption = document.getElementById(`option-${questionId}-${question.correct}`);
                correctOption.classList.add('correct');
                questionBlock.classList.remove('correct');
                questionBlock.classList.add('incorrect', 'answered');
                feedback.className = 'feedback show incorrect-message';
                feedback.innerHTML = `❌ Sai! Đáp án đúng là: <strong>${['A', 'B', 'C', 'D'][question.correct]}</strong>`;
            }

            updateStats();
            updateProgress();
        }

        function updateStats() {
            let correct = 0, incorrect = 0, skipped = 0;

            questions.forEach(q => {
                if (answered[q.id] === undefined) {
                    skipped++;
                } else if (answered[q.id] === q.correct) {
                    correct++;
                } else {
                    incorrect++;
                }
            });

            document.getElementById('correctCount').textContent = correct;
            document.getElementById('incorrectCount').textContent = incorrect;
            document.getElementById('skippedCount').textContent = skipped;
        }

        function updateProgress() {
            const answered_count = Object.keys(answered).length;
            const progress = (answered_count / questions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function resetQuiz() {
            answered = {};
            questions.forEach(q => {
                document.querySelectorAll(`input[name="q${q.id}"]`).forEach(input => {
                    input.checked = false;
                });
                document.getElementById(`question-${q.id}`).className = 'question-block';
                document.getElementById(`feedback-${q.id}`).className = 'feedback';
            });
            updateStats();
            updateProgress();
            document.getElementById('content').scrollTop = 0;
        }

        function showAllAnswers() {
            questions.forEach(q => {
                if (answered[q.id] === undefined) {
                    handleAnswer(q.id, q.correct);
                }
            });
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initQuiz();
            updateStats();
        });
    </script>
</body>
</html>
